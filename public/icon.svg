<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimalist Circular Logo for Govt Job (White Base, Subtle Red Accent, No .site) -->
  
  <!-- Outer Clean Circle (White Background) -->
  <circle cx="256" cy="256" r="248" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />

  <!-- Outer Elegant Dark Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#0f172a" stroke-width="12" />

  <!-- Inner Golden Amber Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#f59e0b" stroke-width="3" />

  <!-- Minimal Accent Icon: Dual Tone Badge Dot -->
  <circle cx="256" cy="140" r="16" fill="#f59e0b" />
  <circle cx="256" cy="140" r="6" fill="#b91c1c" />

  <!-- Brand Typography: GOVT JOB -->
  <text x="256" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="92" fill="#0f172a" text-anchor="middle" letter-spacing="4">
    GOVT
  </text>

  <text x="256" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="92" fill="#d97706" text-anchor="middle" letter-spacing="4">
    JOB
  </text>

  <!-- Clean Minimal Accent Divider -->
  <line x1="206" y1="382" x2="306" y2="382" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" />
</svg>
