<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are Offline - Govt Job 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fdfbf7;
      color: #171717;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: white;
      border: 3px solid #b91c1c;
      padding: 2rem 1.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border-radius: 4px;
    }
    .badge {
      display: inline-block;
      background-color: #8b0000;
      color: #fef08a;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      color: #8b0000;
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 0.75rem;
    }
    p {
      color: #4b5563;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background-color: #b91c1c;
      color: white;
      font-weight: 800;
      font-size: 0.875rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #7f1d1d;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.svg" width="80" height="80" style="border-radius: 50%; margin: 0 auto 1rem; display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.15);" alt="Govt Job" />
    <div class="badge">No Internet Connection</div>
    <h1>You are currently offline</h1>
    <p>
      Please check your network connection. GovtJob.site will automatically reload latest recruitment notifications once you are back online.
    </p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Try Reconnecting
    </button>
  </div>
</body>
</html>
